[project]
name = "curbcheck"
version = "0.1.0"
description = "Rules-grounded curbside recycling checker with calibrated abstention"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "pillow", "numpy", "scipy", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B023", "SIM115"]
