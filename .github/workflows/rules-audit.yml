name: Rule audit
on:
  schedule:
    - cron: "0 6 1 * *"   # monthly: do the cited city pages still say what each rule quotes?
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . requests
      - name: Re-check every quote against its source page
        run: python scripts/verify_rules.py --allow-blocked
